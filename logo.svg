<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo">
  <defs>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ebee"/>
      <stop offset="0.5" stop-color="#aeb4ba"/>
      <stop offset="1" stop-color="#868d94"/>
    </linearGradient>
    <mask id="cut">
      <rect width="100" height="100" fill="black"/>
      <!-- disc -->
      <circle cx="50" cy="53" r="34" fill="white"/>
      <!-- sun cut-out -->
      <circle cx="50" cy="44" r="14" fill="black"/>
      <!-- central triangle (apex pokes into the sun) -->
      <path d="M50 45 L34 80 L66 80 Z" fill="white"/>
      <!-- slanted gaps separating triangle from the ring -->
      <path d="M52.18 46 L47.82 44 L31.82 79 L36.18 81 Z" fill="black"/>
      <path d="M47.82 46 L52.18 44 L68.18 79 L63.82 81 Z" fill="black"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="url(#sil)" mask="url(#cut)"/>
</svg>
